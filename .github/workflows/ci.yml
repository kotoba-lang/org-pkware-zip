name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: clojure -M:test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache m2 / gitlibs
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-jdk${{ matrix.java }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-jdk${{ matrix.java }}-clj-

      - name: Run tests
        run: clojure -M:test

      - name: Lint
        run: clojure -M:lint

  # Building and reading an archive must work on a runtime with no host codec,
  # so the portability claim gets a gate rather than a README paragraph. nbb has
  # no dependency resolver: org-ietf-deflate comes from the sibling path west
  # also produces, pinned to the sha in deps.edn.
  cljs:
    name: nbb run-tests.cljs (ClojureScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install nbb
        run: npm install -g nbb@1.4.210

      - name: Fetch the pinned org-ietf-deflate as a sibling checkout
        run: |
          sha=$(grep -o '"[0-9a-f]\{40\}"' deps.edn | head -1 | tr -d '"')
          git clone https://github.com/kotoba-lang/org-ietf-deflate.git ../org-ietf-deflate
          git -C ../org-ietf-deflate checkout "$sha"

      - name: Run the portable suite on ClojureScript
        run: nbb run-tests.cljs
